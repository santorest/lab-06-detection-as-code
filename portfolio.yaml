summary:
  en: >-
    Fifteen ATT&CK-mapped Sigma rules for Windows, Linux and Azure. Every pull request lints them, converts them to
    Splunk, Elastic and Sentinel queries, and runs them against positive and negative sample events on two engines
    (Zircolite and Elasticsearch) before a ruleset lets the change merge.
  es: >-
    Quince reglas Sigma mapeadas a ATT&CK para Windows, Linux y Azure. Cada pull request las valida, las convierte a
    consultas de Splunk, Elastic y Sentinel y las ejecuta contra eventos de prueba positivos y negativos en dos
    motores (Zircolite y Elasticsearch) antes de que un ruleset permita fusionar el cambio.
tools: [Sigma, sigma-cli, pySigma, Zircolite, Elasticsearch, Splunk SPL, ES|QL, KQL, Microsoft Sentinel, Sysmon, auditd,
        GitHub Actions, Python, pytest]
