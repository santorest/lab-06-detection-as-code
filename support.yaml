# Declared gaps. kind: unsupported  -> the tool rejects the rule; CI re-runs it and fails if it now works (stale).
#                kind: not-applicable -> no meaningful target exists; CI skips it.
# targets: splunk | lucene | esql | kusto | zircolite | elasticsearch
exclusions:
  - rule: auditd_reverse_shell_dev_tcp
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: auditd_ssh_authorized_keys_write
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: auditd_cron_persistence_write
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: activity_mass_resource_deletion
    targets: [lucene, kusto, elasticsearch]
    kind: unsupported
    reason: >-
      Sigma correlation rules are not supported by the pySigma lucene and kusto backends (sigma-cli 3.1.0); the
      Elasticsearch engine runs Lucene conversions, so it cannot evaluate this rule. Splunk, ES|QL and Zircolite do.
