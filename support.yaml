# Declared gaps. kind: unsupported  -> the tool rejects the rule; CI re-runs it and fails if it now works (stale).
#                kind: not-applicable -> no meaningful target exists; CI skips it.
# targets: splunk | lucene | esql | kusto | zircolite | elasticsearch
exclusions:
  - rule: auditd_reverse_shell_dev_tcp
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: auditd_ssh_authorized_keys_write
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: auditd_cron_persistence_write
    targets: [kusto]
    kind: not-applicable
    reason: Microsoft Sentinel has no standard table for raw auditd EXECVE/PATH records; the query would have no table.
  - rule: activity_mass_resource_deletion
    targets: [lucene, kusto, elasticsearch]
    kind: unsupported
    reason: >-
      Sigma correlation rules are not supported by the pySigma lucene and kusto backends (sigma-cli 3.1.0); the
      Elasticsearch engine runs Lucene conversions, so it cannot evaluate this rule. Splunk, ES|QL and Zircolite do.
  - rule: proc_access_lsass
    targets: [kusto]
    kind: unsupported
    reason: >-
      The kusto backend's microsoft_xdr pipeline has no Defender XDR table for Sysmon process access (event 10):
      "Unable to determine table name from rule".
  - rule: security_local_admin_member_added
    targets: [kusto]
    kind: unsupported
    reason: >-
      The kusto backend's microsoft_xdr pipeline has no Defender XDR table for Windows Security event 4732:
      "Unable to determine table name from rule". A custom SecurityEvent pipeline was tried and rejected, because
      combined with microsoft_xdr it drops the EventID condition (the query would also match 4733, member removed).
  - rule: security_log_cleared
    targets: [kusto]
    kind: unsupported
    reason: >-
      The kusto backend's microsoft_xdr pipeline has no Defender XDR table for Windows Security event 1102:
      "Unable to determine table name from rule". A custom SecurityEvent pipeline was tried and rejected, because
      combined with microsoft_xdr it drops the EventID condition (the query came out empty).
  - rule: system_service_install_user_path
    targets: [kusto]
    kind: unsupported
    reason: >-
      The kusto backend's microsoft_xdr pipeline has no Defender XDR table for Windows System event 7045:
      "Unable to determine table name from rule". In Sentinel's Event table ImagePath exists only inside the
      EventData XML, so there is no column to map it to.
